[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "for k, v in pairs(self.P_CENTERS) do"
position = "after"
payload = '''
    -- SMODS Stability: Ensure vanilla editions have safe loc_vars for nil card instances (Deck Selection)
    if k == 'e_foil' or k == 'e_holo' or k == 'e_polychrome' then
        v.loc_vars = function(self, info_queue, card)
            return { vars = { self.config.extra } }
        end
    elseif k == 'e_negative' then
        v.loc_vars = function(self, info_queue, card)
            if (card and card.ability and card.ability.set == 'Base') or (card and card.config and card.config.center and card.config.center.set == 'Base') then
                return { vars = { 1 }, key = 'e_negative_playing_card' }
            end
            return { vars = { 1 } }
        end
    end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "boot_timer('splash prep', 'end',1)"
position = "after"
payload = "if BalatroOdyssey and BalatroOdyssey.apply_config then BalatroOdyssey.apply_config() end"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/common_events.lua"
pattern = "if not v.boss then"
position = "at"
payload = "if v.omit or not v.boss then"
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "win_ante = 8,"
position = "at"
payload = "win_ante = 100,"
match_indent = true

[[patches]]
[patches.regex]
target = "game.lua"
pattern = "if v\\.set == 'Joker' then table\\.insert\\(self\\.P_CENTER_POOLS\\['Joker'\\], v\\) end"
position = "at"
payload = "if v.set == 'Joker' and not v.omit then table.insert(self.P_CENTER_POOLS['Joker'], v) end"

[[patches]]
[patches.regex]
target = "game.lua"
pattern = "if v\\.rarity and v\\.set == 'Joker' and not v\\.demo then table\\.insert\\(self\\.P_JOKER_RARITY_POOLS\\[v\\.rarity\\], v\\) end"
position = "at"
payload = "if v.rarity and v.set == 'Joker' and not v.demo and not v.omit then table.insert(self.P_JOKER_RARITY_POOLS[v.rarity], v) end"

[[patches]]
[patches.regex]
target = "functions/button_callbacks.lua"
pattern = "#G\\.hand\\.highlighted\\s*>\\s*5"
position = "at"
payload = "#G.hand.highlighted > 10"

[[patches]]
[patches.regex]
target = "functions/button_callbacks.lua"
pattern = "G\\.hand\\.config\\.card_limit\\s*<=\\s*0"
position = "at"
payload = "true"

[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = "G\\.GAME\\.shop\\.joker_max\\s*\\*\\s*1\\.02\\s*\\*\\s*G\\.CARD_W,"
position = "at"
payload = "(G.GAME.shop.joker_max + (G.GAME.shop_extra_joker_slots or 0))*1.02*G.CARD_W,"

[[patches]]
[patches.regex]
target = "functions/UI_definitions.lua"
pattern = "\\{card_limit\\s*=\\s*G\\.GAME\\.shop\\.joker_max,\\s*type\\s*=\\s*'shop',\\s*highlight_limit\\s*=\\s*1\\}\\)"
position = "at"
payload = "{card_limit = G.GAME.shop.joker_max + (G.GAME.shop_extra_joker_slots or 0), type = 'shop', highlight_limit = 1})"

[[patches]]
[patches.regex]
target = "functions/state_events.lua"
pattern = "card_eval_status_text\\(G\\.jokers\\.cards\\[i\\],\\s*'jokers',\\s*nil,\\s*percent,\\s*nil,\\s*effects\\.jokers\\)"
position = "after"
payload = '''
            -- Odyssey: Joker on Joker effects (Quantum Field, Singularity, etc.)
            for _, v in ipairs(G.jokers.cards) do
                local _card = G.jokers.cards[i]
                local effect = v:calculate_joker{full_hand = G.play.cards, scoring_hand = scoring_hand, scoring_name = text, poker_hands = poker_hands, other_joker = _card}
                if effect then
                    local extras = {mult = false, hand_chips = false}
                    if effect.mult_mod then mult = mod_mult(mult + effect.mult_mod);extras.mult = true end
                    if effect.chip_mod then hand_chips = mod_chips(hand_chips + effect.chip_mod);extras.hand_chips = true end
                    if (effect.Xmult_mod or effect.x_mult_mod) then mult = mod_mult(mult*(effect.Xmult_mod or effect.x_mult_mod));extras.mult = true  end
                    if extras.mult or extras.hand_chips then update_hand_text({delay = 0}, {chips = extras.hand_chips and hand_chips, mult = extras.mult and mult}) end
                    if extras.mult or extras.hand_chips then card_eval_status_text(v, 'jokers', nil, percent, nil, effect) end
                    percent = percent+percent_delta
                end
            end
'''

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{card_limit = 1, type = 'shop', highlight_limit = 1})"
position = "at"
payload = "{card_limit = 1 + (G.GAME.shop_extra_voucher_slots or 0), type = 'shop', highlight_limit = 1})"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "{card_limit = 2, type = 'shop', highlight_limit = 1, card_w = 1.27*G.CARD_W})"
position = "at"
payload = "{card_limit = 2 + (G.GAME.shop_extra_booster_slots or 0), type = 'shop', highlight_limit = 1, card_w = 1.27*G.CARD_W})"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "function create_UIBox_blind_popup(blind, discovered, vars)"
position = "after"
payload = "if G.GAME and G.GAME.odyssey_webb_active then discovered = true end"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "table.sort(G.playing_cards, function (a, b) return a:get_nominal('suit') > b:get_nominal('suit') end )"
position = "at"
payload = '''
  if G.GAME and G.GAME.odyssey_hubble_active then
      local order = {}
      for k, v in ipairs(G.deck.cards) do order[v] = k end
      table.sort(G.playing_cards, function (a, b) 
          local order_a = order[a] or 999
          local order_b = order[b] or 999
          return order_a < order_b 
      end)
  else
      table.sort(G.playing_cards, function (a, b) return a:get_nominal('suit') > b:get_nominal('suit') end )
  end
'''
match_indent = true
